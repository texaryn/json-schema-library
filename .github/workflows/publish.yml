name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Check tag version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const { version } = JSON.parse(readFileSync("package.json", "utf8"))
            if (process.env.GITHUB_REF_NAME !== `v${version}`) process.exit(1)
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:src
      - run: pnpm run lint:types
      - run: pnpm run test
      - run: pnpm run test:unit
      - run: pnpm run dist
      - name: Publish package if the version is not already on npm
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version --silent >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping immutable version."
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
